; generated by tools/space_scenario.py (goods from space_goods.py) - read by the spacerace plugin.
; What each rocket takes at lift-off from storage buildings within `radius` of its pad, and how long
; the plugin flies it before the script removes it.
radius 450
climb_seconds 18
; effects from particleeffect/particleeffects.ini: under the rocket, its trail, round the pad at lift-off, a failure
fx_flame airplane_jet
fx_smoke big_firesmoke
fx_pad factory_big_white
fx_boom buildingfall2
; vm_goods: added goods scripts may read, answered with _Resources_reserved_16_.._19_ in this order
vm_goods lox hypergolic spacecraft avionics
; rocket <object> <the only pad kind it may stand on> then <good> <tonnes> pairs taken at lift-off
rocket sr_sputnik sr_pad_r7 fuel 8 lox 20 spacecraft 2 food 1
rocket sr_vostok sr_pad_r7 fuel 10 lox 25 spacecraft 5 food 1
rocket sr_soyuz sr_pad_r7 fuel 12 lox 30 spacecraft 7 food 2
rocket sr_proton sr_pad_r7 hypergolic 60 spacecraft 8
rocket sr_n1 sr_pad_n1 fuel 80 lox 200 spacecraft 25 food 3
; bill <object> then <good> <tonnes> pairs: what the MIK builds it from (workdays stay the engine's)
bill sr_sputnik rocket_stage 16 rocket_engine 6 avionics 1
bill sr_vostok rocket_stage 20 rocket_engine 7 avionics 2
bill sr_soyuz rocket_stage 26 rocket_engine 9 avionics 3
bill sr_proton rocket_stage 45 rocket_engine 14 avionics 4
bill sr_n1 rocket_stage 120 rocket_engine 40 avionics 8
