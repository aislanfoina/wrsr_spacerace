; spacerace - the Space Race in any game. UTF-8, no BOM.
;
; kit_item   the Space Race Kit's workshop item id; the research branch unlocks
;            its buildings as <kit_item>/sr_<building>. 3814049784 is the
;            published kit; a local development copy has its own id.
; autostart  1 = start the programme scenario in every game that has no scenario
;            of its own (it sleeps, unseen, until the republic researches the
;            Rocket Research Institute and builds the Design Bureau); 0 = never.
; research   1 = add the space branch to the research tree.
; scenario / mission   the scenario folder the programme lives in, and the name
;            its missions start with (race -> race_<code>, one per set of rules).
; link_range every launch pad is linked to the nearest MIK within this many
;            metres; the MIK builds rockets only for linked pads and puts each
;            finished rocket on one of them.

; test_mode  1 = for testing: space research at test_cost of its price (0.05 =
;            5 %), no year limits, and the Rocket Research Institute open from the
;            start without the vanilla engineering chain. 0 for real play.

; new_goods  0 = no new goods: liquid oxygen and hypergolic propellant are carried
;            as chemicals, rocket stages and engines as mechanical components,
;            avionics and spacecraft as electronics. Saves stay the base game's.
;            1 = six new goods (rocket stages, rocket engines, avionics, liquid
;            oxygen, hypergolic propellant, spacecraft), each with its own industry.
;            Either way works with an existing republic: switch it on, load the
;            save and the new goods join it; switch it off, load, and whatever of
;            them is in stock becomes its stand-in (chemicals, mechanical components,
;            electronics). Save once after switching. Keep a backup: switching off
;            does not bring the new goods back later.

[general]
kit_item  = 3814049784
autostart = 1
research  = 1
scenario  = spacerace
mission   = race
link_range = 2000
test_mode = 0
test_cost = 0.05
new_goods = 0

; ---- balance: written by tools/space_settings.py from the generators' defaults ----

; Change any value and restart the game. Research, buildings and rocket parts apply to every
; game, saves included. The programme's rules - [america], [milestones], [rockets], [launches]
; and [rewards] - are fixed when a game starts: a running game keeps the rules it began with,
; and new games take the current ones. (The plugin writes each set of rules as a mission of its
; own, media_soviet\scenarios\spacerace\race_<code>, and leaves every one it wrote in place.)
; Cosmonaut and chief-designer training - how long, how many, who - is in experts.ini.

[research]
; <entry> = year <first year it can be researched>, cost <research points>
year_shift = 0                     ; added to every year: -10 starts the space age a decade early
cost_scale = 1.0                   ; multiplies every cost
sr_rocketry = year 1946, cost 2500       ; Rocket Research Institute (NII-88)
sr_liquid_engines = year 1948, cost 3000 ; Liquid Rocket Engines
sr_cryogenics = year 1949, cost 2400     ; Cryogenic Oxygen
sr_guidance = year 1950, cost 2800       ; Radio Guidance and Telemetry
sr_r7_icbm = year 1954, cost 4500        ; The R-7 Semyorka
sr_satellite = year 1956, cost 3500      ; Artificial Earth Satellite
sr_biosatellite = year 1957, cost 2500   ; Biological Satellites
sr_lunar_probes = year 1958, cost 3000   ; Lunar Probes
sr_manned_flight = year 1959, cost 5000  ; Manned Spaceflight
sr_space_glory = year 1961, cost 1500    ; Glory to the Conquerors of Space
sr_hypergolic = year 1958, cost 3000     ; Storable Propellants
sr_eva = year 1963, cost 3000            ; Extravehicular Activity
sr_soyuz = year 1963, cost 4500          ; The Soyuz Spacecraft
sr_proton = year 1962, cost 5500         ; Heavy Launcher (UR-500)
sr_n1_programme = year 1964, cost 9000   ; The N1 Moon Rocket
sr_nk33 = year 1966, cost 6000           ; NK-33 Engines and KORD
sr_lunar_landing = year 1966, cost 7000  ; Lunar Landing (L3)

[america]
; the day the United States reaches each milestone (YYYY-MM-DD), or never. The programme opens
; when the republic has researched the Rocket Research Institute and built the Design Bureau
; (OKB-1); until then nothing happens, and the Americans are not counted. A programme that opens
; after start: late_start = shift moves every American date by the delay (a whole race, later);
; history keeps the real dates, and what the Americans did before it opened costs nothing.
year_shift = 0                     ; added to every year: 5 gives the Americans five slower years
start = 1954-01-01                 ; the programme is expected to open by this day
late_start = shift                 ; shift or history
sputnik = 1958-01-31               ; Explorer 1 (The first satellite)
laika = 1961-01-31                 ; Ham the chimpanzee (A passenger in orbit)
luna = 1962-04-26                  ; Ranger 4 (To the Moon)
vostok = 1962-02-20                ; John Glenn (The first man in space)
voskhod = 1965-06-03               ; Ed White (A walk in space)
soyuz = 1966-03-16                 ; Gemini 8 (Rendezvous and docking)
zond = 1968-12-21                  ; Apollo 8 (Around the Moon)
moon = 1969-07-20                  ; Apollo 11 (A Soviet footprint on the Moon)

[milestones]
; failure  % chance the launch fails, before any earlier success of its rocket
; crew     cosmonauts (experts) the republic needs; tracking  tracking stations it needs
sputnik = failure 30, crew 0, tracking 0 ; The first satellite (R-7 Sputnik)
laika = failure 25, crew 0, tracking 0   ; A passenger in orbit (R-7 Sputnik)
luna = failure 35, crew 0, tracking 1    ; To the Moon (Vostok-K)
vostok = failure 15, crew 1, tracking 1  ; The first man in space (Vostok-K)
voskhod = failure 15, crew 2, tracking 1 ; A walk in space (Soyuz)
soyuz = failure 15, crew 3, tracking 2   ; Rendezvous and docking (Soyuz)
zond = failure 35, crew 0, tracking 2    ; Around the Moon (Proton)
moon = failure 70, crew 2, tracking 3    ; A Soviet footprint on the Moon (N1-L3)

[rockets]
; what a launch takes from storage buildings near its pad, in tonnes: fuel, lox, hypergolic,
; spacecraft and food (the programme checks those five). With new_goods = 0 their stand-ins
; are taken: chemicals for lox and hypergolic, electronics for spacecraft.
sr_sputnik = fuel 8, lox 20, spacecraft 2, food 1    ; R-7 Sputnik
sr_vostok = fuel 10, lox 25, spacecraft 5, food 1    ; Vostok-K
sr_soyuz = fuel 12, lox 30, spacecraft 7, food 2     ; Soyuz
sr_proton = hypergolic 60, spacecraft 8              ; Proton
sr_n1 = fuel 80, lox 200, spacecraft 25, food 3      ; N1-L3

[rocket_parts]
; what the MIK builds each rocket from, in tonnes (the workdays stay the game's); the MIK
; takes in rocket stages, rocket engines and avionics. new_goods = 1 only: with stand-ins the
; MIK takes the game's own vehicle parts, worked out from each rocket's weight.
sr_sputnik = rocket_stage 16, rocket_engine 6, avionics 1 ; R-7 Sputnik
sr_vostok = rocket_stage 20, rocket_engine 7, avionics 2 ; Vostok-K
sr_soyuz = rocket_stage 26, rocket_engine 9, avionics 3 ; Soyuz
sr_proton = rocket_stage 45, rocket_engine 14, avionics 4 ; Proton
sr_n1 = rocket_stage 120, rocket_engine 40, avionics 8 ; N1-L3

[launches]
radius = 450               ; storage buildings this close to the pad supply a launch (m)
park_distance = 90         ; a rocket counts as standing on its pad this close to it (m)
climb_seconds = 18         ; how long a rocket climbs before it leaves the map (s)
pad_repair_days = 30       ; a failed launch closes the pad this long in games without building fires
failure_per_success = 5    ; each earlier success of the same rocket lowers its failure chance (%)
failure_test_stand = 10    ; an engine test stand anywhere in the republic lowers every failure chance (%)
failure_nk33 = 35          ; the NK-33 research lowers the N1's failure chance (%)
failure_min = 5            ; no launch is ever safer than this (% failure)

[rewards]
first_money = 25000            ; USD for reaching a milestone before the Americans
first_loyalty = 12             ; loyalty for every citizen then (%)
second_money = 5000            ; USD for reaching it after them
second_loyalty = 3             ; loyalty then (%)
america_first_loyalty = -5     ; loyalty when the Americans reach a milestone first (%)
victory_money = 100000         ; USD for the Moon before the Americans
victory_loyalty = 20           ; loyalty then (%)

[buildings]
cost_scale = 1.0           ; multiplies the construction cost of every Space Race building
;
; [building:<object>] for each one:
;   cost         absolute amounts: workers = workdays, then tonnes of each good. The defaults
;                are what the game makes of the kit's own model-sized costs; the plugin spreads
;                them over the ground works, casting and steel phases. auto = the model-sized cost.
;   cost_scale   multiplies this building's cost
;   workers      staff it needs; educated = how many of them need a university education
;   production   <good> <tonnes per worker per day>, ...  (factories)
;   consumption  <good> <tonnes per worker per day>, ...  (a new good also needs a storage
;                slot in the building, which only the kit generator can add)
; Recipes name the new goods; with new_goods = 0 each is read as its stand-in, and an input
; that becomes the factory's own output is left out.

