; experts - the fourth education tier. UTF-8, no BOM.
;
; Education is a number per citizen: 0-1 none, 1-2 basic, 2-3 higher. A citizen
; who works at one of the buildings below climbs past 3.0 and becomes
; an EXPERT. The base game treats experts as higher-educated everywhere, and
; saves them as they are: removing this plugin just leaves them as graduates.
;
; One [building:<object>] section per training building. <object> is the
; building's folder name inside its workshop item (the part after the "/" in
; the game's type ident), so other mods can add their own sections here.
;
;   days_per_tier   game days employed there to gain one full tier
;   rate_per_day    the same thing written as education per day (last one wins)
;   min_education   only citizens at or above this train (2.0 = graduates)
;   max_education   training stops here (at most 3.99)
;   min_age/max_age age gate, in years
;   min_health      health gate, 0-1
;   class_size      seats in the class (default 40). Eligible citizens who work
;                   a shift here join while seats are free, best-educated first,
;                   and stay in the class whatever job they take next (the game
;                   hands out jobs day by day). The class gains a tier in
;                   days_per_tier days when the building's eligible staff fill
;                   every seat, proportionally slower when fewer turn up.

refresh_ticks = 60

; Star City: graduates aged 23-35 in good health, about a year of training.
; The historical 1960 group trained for a year before Gagarin flew.
[building:sr_training]
days_per_tier = 365
class_size = 40
min_education = 2.0
max_education = 3.0
min_age = 23
max_age = 35
min_health = 0.80

; The design bureau turns its engineers into chief designers - slower, no age gate.
[building:sr_bureau]
days_per_tier = 730
class_size = 20
min_education = 2.0
max_education = 3.60
min_age = 30
max_age = 65
min_health = 0.50
