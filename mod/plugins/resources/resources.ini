; resources - the Space Race goods. UTF-8, no BOM.
;
; Read by resources.dll (ported from vendor/TesmioLoader/plugins/resources, see
; the head of resources.cpp) from beside the DLL. Field reference: the vendored
; vendor/TesmioLoader/plugins/resources/resources.ini.
;
; SAVES ARE NOT COMPATIBLE ACROSS CHANGES TO [list]. The resource count is part
; of the save format: a save written with these goods will not load without
; them, and a save written without them will not load with them. Freeze this
; list before a release; only ever append.
;
; The engine allocates 63 records and uses 57, so these six fit without moving
; the array (resource_capacity = -1).
;
; Scripts see a good only through the name -> field chain at SOVIET64 0x59B3F0,
; which knows nothing of these names; the spacerace plugin answers four of them
; with the spare _Resources_reserved_16_.._19_ fields (its launches.ini
; `vm_goods` line). The order here does not matter for that.

[list]
rocket_stage  = aluminium, Rocket Stages
rocket_engine = mcomponents, Rocket Engines
avionics      = eletronics, Avionics
lox           = oil, Liquid Oxygen
hypergolic    = oil, Hypergolic Propellant
spacecraft    = eletronics, Spacecraft

; oil clones would otherwise count as oil for the base game's material families
[custom:lox]
family = none

[custom:hypergolic]
family = none

[resources]
hook = 2
resource_rva = 0x2AA830
resource_vector_rva = 0x9E11C0
resource_capacity = -1
price_hook = 1
price_report = 0

[customs]
; the survivors plugin (Republic in Ruins) owns the customhouse tick
hook = 0
